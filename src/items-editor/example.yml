# BeltariaContent : items personnalises, a donner avec /content give.
#
# Un bloc par item. La cle est l'identifiant : c'est lui qui se tape en commande, et c'est lui,
# par defaut, qui est ecrit dans le marqueur beltaria:id de l'item. Le pack reconnait ce marqueur
# par une regle CIT et pose le modele ou la texture ; le plugin, lui, ne fait que fabriquer l'item.
#
# Minuscules, chiffres, _ et - seulement.
#
#   material     : matiere Bukkit 1.8 (DIAMOND_SWORD, WOOL...). Obligatoire.
#   data         : variante de la matiere - couleur d'une laine, durabilite. Defaut 0.
#   amount       : quantite donnee quand la commande n'en precise pas. Defaut 1.
#   name         : nom affiche, codes couleur avec &. Defaut : celui de la matiere.
#   lore         : lignes de description sous le nom. Facultatif.
#   enchantments : ENCHANTEMENT: niveau, aux noms Bukkit (DAMAGE_ALL, DIG_SPEED, PROTECTION_
#                  ENVIRONMENTAL...). Les niveaux au-dela du maximum vanilla sont acceptes.
#   flags        : parties de l'infobulle a masquer (HIDE_ATTRIBUTES, HIDE_ENCHANTS,
#                  HIDE_UNBREAKABLE...). Facultatif.
#   unbreakable  : item incassable. Defaut false.
#   marker       : valeur ecrite dans le marqueur, si elle differe de l'identifiant - pour donner
#                  deux items d'apparence identique sous deux noms. Une chaine vide n'ecrit aucun
#                  marqueur : l'item reste d'apparence vanilla, ce qui sert de temoin.
#
# (Copie synthetique de la structure de BeltariaContent/src/main/resources/items.yml, pour
# l'exemple de l'editeur ; beltarium_sword reprend l'exemple de la javadoc d'ItemsConfig.)

beltarium_helmet:
  material: DIAMOND_HELMET
  name: "&bCasque en beltarium"
  flags:
    - HIDE_ATTRIBUTES
  unbreakable: true

beltarium_chestplate:
  material: DIAMOND_CHESTPLATE
  name: "&bPlastron en beltarium"
  flags:
    - HIDE_ATTRIBUTES
  unbreakable: true

beltarium_sword:
  material: DIAMOND_SWORD
  name: "&bEpee en beltarium"
  lore:
    - "&7Forgee dans le beltarium."
  enchantments:
    DAMAGE_ALL: 5
    FIRE_ASPECT: 2
  flags: [HIDE_UNBREAKABLE]
  unbreakable: true

# Temoins de diagnostic : leur regle CIT ne regarde aucun marqueur, seulement la matiere.
temoin_modele:
  material: DIRT
  name: "&eTemoin de modele"
  lore:
    - "&7Doit s'afficher comme un modele temoin,"
    - "&7sans condition de marqueur."
  marker: ""

# Les caisses. La matiere doit rester celle de base-item du descripteur - stone.
crate_gold:
  material: STONE
  name: "&6Caisse doree"
  block:
    anchor: NOTE_BLOCK
    spin: 1.5
    bob: 1.0

# ---------------------------------------------------------------------------------------------
# Les gemmes que lachent les minerais.
# ---------------------------------------------------------------------------------------------

ruby:
  material: PAPER
  name: "&cRubis"

legendary_key:
  material: TRIPWIRE_HOOK
  name: "&fLegendary Key"
