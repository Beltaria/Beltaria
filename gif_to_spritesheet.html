<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extracteur de GIF & Générateur de SpriteSheet</title>
    
    <!-- Tailwind CSS pour un design moderne et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuration personnalisée pour Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#121212',
                            panel: '#1E1E1E',
                            border: '#2C2C2C',
                            accent: '#4F46E5', // Indigo 600
                            hover: '#6366F1'  // Indigo 500
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: theme('colors.dark.bg');
            color: #E5E7EB;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* Damier pour visualiser la transparence des PNG */
        .checkerboard {
            background-color: #1E1E1E;
            background-image: 
                linear-gradient(45deg, #2C2C2C 25%, transparent 25%), 
                linear-gradient(-45deg, #2C2C2C 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2C2C2C 75%), 
                linear-gradient(-45deg, transparent 75%, #2C2C2C 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border-radius: 0.5rem;
        }

        /* Scrollbar stylisée */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: theme('colors.dark.panel'); 
        }
        ::-webkit-scrollbar-thumb {
            background: #4B5563; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6B7280; 
        }

        /* Animation de chargement */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid theme('colors.dark.accent');
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">
    <div class="w-full max-w-4xl bg-dark-panel border border-dark-border rounded-2xl shadow-2xl p-6 md:p-8 space-y-8">
        
        <!-- En-tête -->
        <div class="text-center">
            <h1 class="text-3xl font-bold text-white mb-2">Extracteur de GIF vers SpriteSheet</h1>
            <p class="text-gray-400 text-sm">Découpez, redimensionnez (Pixel Art) et compilez les images d'un GIF de haut en bas.</p>
        </div>

        <!-- Zone d'importation du fichier -->
        <div id="drop-zone" class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center hover:border-dark-hover transition-colors cursor-pointer relative bg-[#181818]">
            <input type="file" id="file-input" accept=".gif" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
            <svg class="w-12 h-12 text-gray-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <p class="text-gray-300 font-medium">Glissez & déposez votre GIF ici</p>
            <p class="text-gray-500 text-sm mt-1">ou cliquez pour parcourir</p>
            <p id="file-name" class="text-dark-accent font-semibold mt-3 text-sm hidden"></p>
        </div>

        <!-- Indicateur de chargement & Erreur -->
        <div id="loading-indicator" class="hidden flex items-center justify-center space-x-3 text-gray-300">
            <div class="loader"></div>
            <span>Analyse du GIF en cours...</span>
        </div>
        <div id="error-message" class="hidden bg-red-900/50 border border-red-500 text-red-200 px-4 py-3 rounded-lg text-sm text-center"></div>

        <div id="settings-panel" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6 items-end bg-[#1a1a1a] p-5 rounded-xl border border-dark-border">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Nouvelle Largeur (px)</label>
                <input type="number" id="width-input" min="1" class="w-full bg-dark-bg border border-gray-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-dark-accent focus:ring-1 focus:ring-dark-accent transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Nouvelle Hauteur (px)</label>
                <input type="number" id="height-input" min="1" class="w-full bg-dark-bg border border-gray-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-dark-accent focus:ring-1 focus:ring-dark-accent transition-all">
            </div>
            <div>
                <button id="convert-btn" class="w-full bg-dark-accent hover:bg-dark-hover text-white font-semibold py-2.5 px-4 rounded-lg shadow-lg transform hover:-translate-y-0.5 transition-all focus:outline-none">
                    Générer le SpriteSheet
                </button>
            </div>
        </div>

        <div id="result-section" class="hidden flex-col items-center space-y-6">
            <div class="w-full text-center">
                <a id="download-btn" class="inline-flex items-center justify-center bg-green-600 hover:bg-green-500 text-white font-semibold py-3 px-6 rounded-lg shadow-lg transform hover:-translate-y-0.5 transition-all text-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Télécharger l'image (.png)
                </a>
            </div>
            
            <div class="w-full bg-[#181818] border border-dark-border rounded-xl p-4">
                <p class="text-xs text-gray-500 mb-3 text-center uppercase tracking-wider">Aperçu du SpriteSheet généré</p>
                <div class="max-h-[600px] overflow-auto checkerboard border border-gray-700 flex justify-center p-4">
                    <img id="preview-img" class="max-w-none shadow-2xl" alt="Aperçu du sprite">
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import de la librairie gifuct-js via ESM pour décoder le GIF nativement dans le navigateur
        import { parseGIF, decompressFrames } from 'https://esm.sh/gifuct-js@2.1.2';

        // Variables d'état
        let parsedFrames = [];
        let originalWidth = 0;
        let originalHeight = 0;
        let gifFileName = 'spritesheet';

        // Eléments du DOM
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name');
        const loadingIndicator = document.getElementById('loading-indicator');
        const settingsPanel = document.getElementById('settings-panel');
        const widthInput = document.getElementById('width-input');
        const heightInput = document.getElementById('height-input');
        const convertBtn = document.getElementById('convert-btn');
        const resultSection = document.getElementById('result-section');
        const previewImg = document.getElementById('preview-img');
        const downloadBtn = document.getElementById('download-btn');
        const errorMessage = document.getElementById('error-message');
        const dropZone = document.getElementById('drop-zone');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Réinitialisation de l'UI
            errorMessage.classList.add('hidden');
            settingsPanel.classList.add('hidden');
            resultSection.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');
            
            gifFileName = file.name.replace(/\.[^/.]+$/, "");
            fileNameDisplay.textContent = "Fichier sélectionné : " + file.name;
            fileNameDisplay.classList.remove('hidden');
            dropZone.classList.add('border-dark-accent');

            try {
                // Lecture du fichier brut
                const buffer = await file.arrayBuffer();
                
                // Parsing de la structure du GIF
                const gif = parseGIF(buffer);
                
                // Décompression complète pour obtenir les pixels bruts (RGBA)
                parsedFrames = decompressFrames(gif, true);
                
                // Récupération des dimensions d'origine
                originalWidth = gif.lsd.width;
                originalHeight = gif.lsd.height;

                // Pré-remplissage des champs
                widthInput.value = originalWidth;
                heightInput.value = originalHeight;

                settingsPanel.classList.remove('hidden');
            } catch (err) {
                console.error("Erreur lors de la lecture du GIF", err);
                errorMessage.textContent = "Erreur : Impossible de lire ce fichier GIF. Il est peut-être corrompu.";
                errorMessage.classList.remove('hidden');
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        });

        convertBtn.addEventListener('click', () => {
            if (parsedFrames.length === 0) return;

            const targetW = parseInt(widthInput.value) || originalWidth;
            const targetH = parseInt(heightInput.value) || originalHeight;

            // Création du canvas de rendu final (Toutes les frames verticalement)
            const spriteCanvas = document.createElement('canvas');
            spriteCanvas.width = targetW;
            spriteCanvas.height = targetH * parsedFrames.length;
            const outCtx = spriteCanvas.getContext('2d');
            
            // CRUCIAL : Désactive le lissage pour conserver le style pixel art parfait (Nearest Neighbor)
            outCtx.imageSmoothingEnabled = false;

            // Canvas temporaires pour gérer la superposition des frames (Disposal methods du GIF)
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = originalWidth;
            tempCanvas.height = originalHeight;
            const tempCtx = tempCanvas.getContext('2d');

            const previousCanvas = document.createElement('canvas');
            previousCanvas.width = originalWidth;
            previousCanvas.height = originalHeight;
            const prevCtx = previousCanvas.getContext('2d');

            for(let i = 0; i < parsedFrames.length; i++) {
                const frame = parsedFrames[i];

                // Disposal type 2: On efface la zone modifiée par la frame précédente
                if (i > 0 && parsedFrames[i-1].disposalType === 2) {
                    const prev = parsedFrames[i-1];
                    tempCtx.clearRect(prev.dims.left, prev.dims.top, prev.dims.width, prev.dims.height);
                }
                
                // Disposal type 3: On restaure totalement l'état avant la frame précédente
                if (i > 0 && parsedFrames[i-1].disposalType === 3) {
                    tempCtx.clearRect(0, 0, originalWidth, originalHeight);
                    tempCtx.drawImage(previousCanvas, 0, 0);
                } else {
                    // Sauvegarde de l'état actuel au cas où la prochaine frame utiliserait le disposal 3
                    prevCtx.clearRect(0, 0, originalWidth, originalHeight);
                    prevCtx.drawImage(tempCanvas, 0, 0);
                }

                // Création d'un petit canvas juste pour la modification (le "patch") de la frame
                const patchCanvas = document.createElement('canvas');
                patchCanvas.width = frame.dims.width;
                patchCanvas.height = frame.dims.height;
                const patchCtx = patchCanvas.getContext('2d');
                
                // Injection des données brutes RGBA extraites du GIF
                const imgData = patchCtx.createImageData(frame.dims.width, frame.dims.height);
                imgData.data.set(frame.patch);
                patchCtx.putImageData(imgData, 0, 0);

                // Dessin du patch sur notre image de base aux bonnes coordonnées
                tempCtx.drawImage(patchCanvas, frame.dims.left, frame.dims.top);

                // Enfin, copie et redimensionnement (proche voisin) de l'image complète vers le spritesheet final
                outCtx.drawImage(tempCanvas, 0, 0, originalWidth, originalHeight, 0, i * targetH, targetW, targetH);
            }

            // Utilisation de toBlob au lieu de toDataURL pour éviter le crash mémoire sur les gros GIFs
            spriteCanvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                
                previewImg.src = url;
                
                downloadBtn.href = url;
                downloadBtn.download = `${gifFileName}_spritesheet.png`;
                
                resultSection.classList.remove('hidden');
                
                // Scroll fluide vers le résultat
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 'image/png');
        });

        // Petits effets d'UI pour le drag & drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('border-dark-hover', 'bg-gray-800'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('border-dark-hover', 'bg-gray-800'), false);
        });
    </script>
</body>
</html>
